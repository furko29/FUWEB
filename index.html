    const { useState, useEffect, useRef } = React;

    // Web Audio API Sound Synthesizer for Dopamine UX
    const playSoundEffect = (type = 'click', enabled = true) => {
      if (!enabled) return;
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'click') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.08);
        } else if (type === 'levelup') {
          const notes = [440, 554.37, 659.25, 880];
          notes.forEach((freq, i) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.connect(g);
            g.connect(audioCtx.destination);
            o.type = 'sine';
            o.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.05);
            g.gain.setValueAtTime(0.2, audioCtx.currentTime + i * 0.05);
            g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.05 + 0.2);
            o.start(audioCtx.currentTime + i * 0.05);
            o.stop(audioCtx.currentTime + i * 0.05 + 0.2);
          });
        } else if (type === 'fanfare') {
          const notes = [523.25, 659.25, 783.99, 1046.50];
          notes.forEach((freq, i) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.connect(g);
            g.connect(audioCtx.destination);
            o.type = 'triangle';
            o.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.06);
            g.gain.setValueAtTime(0.2, audioCtx.currentTime + i * 0.06);
            g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.06 + 0.25);
            o.start(audioCtx.currentTime + i * 0.06);
            o.stop(audioCtx.currentTime + i * 0.06 + 0.25);
          });
        }
      } catch (e) {
        // Fallback silently
      }
    };

    // Trigger Confetti Explosion
    const triggerConfetti = () => {
      if (window.confetti) {
        window.confetti({
          particleCount: 140,
          spread: 85,
          origin: { y: 0.6 },
          colors: ['#8B5CF6', '#EC4899', '#06B6D4', '#F59E0B', '#ffffff']

    // Spawn Floating XP Gain Text Badge
    const spawnFloatingXP = (text, event) => {
      const container = document.getElementById('floating-xp-container');
      if (!container) return;

      const el = document.createElement('div');
      el.className = 'floating-xp';
      el.innerText = text;

      let x = window.innerWidth / 2;
      let y = window.innerHeight / 2;

      if (event && (event.clientX || event.touches)) {
        x = event.clientX || (event.touches[0] && event.touches[0].clientX) || x;
        y = event.clientY || (event.touches[0] && event.touches[0].clientY) || y;
      }

      el.style.left = `${x}px`;
      el.style.top = `${y}px`;

      container.appendChild(el);
      setTimeout(() => {
        if (el.parentNode) el.parentNode.removeChild(el);
      }, 1200);
    };

      // Initialize Interactive Particle Background Canvas
      useEffect(() => {
        const canvas = document.getElementById('particle-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        const handleResize = () => {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', handleResize);

        let mouseX = width / 2;
        let mouseY = height / 2;

        const handleMouseMove = (e) => {
          mouseX = e.clientX;
          mouseY = e.clientY;
        };
        window.addEventListener('mousemove', handleMouseMove);

        const particles = Array.from({ length: 45 }, () => ({
          x: Math.random() * width,
          y: Math.random() * height,
          radius: Math.random() * 3 + 1,
          color: ['#8B5CF6', '#EC4899', '#06B6D4', '#F59E0B'][Math.floor(Math.random() * 4)],
          vx: (Math.random() - 0.5) * 0.6,
          vy: (Math.random() - 0.5) * 0.6,
          alpha: Math.random() * 0.4 + 0.2
        }));

        const render = () => {
          ctx.clearRect(0, 0, width, height);

          particles.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;

            if (p.x < 0) p.x = width;
            if (p.x > width) p.x = 0;
            if (p.y < 0) p.y = height;
            if (p.y > height) p.y = 0;

            const dx = mouseX - p.x;
            const dy = mouseY - p.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < 150) {
              p.x -= (dx / dist) * 0.5;
              p.y -= (dy / dist) * 0.5;
            }

            ctx.save();
            ctx.globalAlpha = p.alpha;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.shadowBlur = 10;
            ctx.shadowColor = p.color;
            ctx.fill();
            ctx.restore();
          });

          animationFrameId = requestAnimationFrame(render);
        };

        render();

        return () => {
          window.removeEventListener('resize', handleResize);
          window.removeEventListener('mousemove', handleMouseMove);
          cancelAnimationFrame(animationFrameId);
        };
      }, []);

      // Media Items Data

                  <p class="text-xs text-gray-300 mt-1">Sign in with Google to claim your VIP Superfan Badge, secret vlog access, and Discord roles.</p>
                </div>

                <button 
                  onClick={handleGoogleLogin}
                  class="btn-shimmer w-full py-3.5 px-6 rounded-2xl bg-white hover:bg-gray-100 text-gray-900 font-extrabold text-sm shadow-xl flex items-center justify-center gap-3 transition-all hover:scale-105 border border-gray-200"
                >
                  <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                  </svg>
                  Sign in with Google
                </button>

                <p class="text-[11px] text-gray-500 font-semibold">By continuing, you agree to the VIP Community Terms & Privacy Policy.</p>
              </div>
            </div>
          )}

          {/* CREATOR PROFILE & HUB SETTINGS DRAWER */}
          {showSettingsDrawer && (
            <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-xl flex items-center justify-end p-4">
              <div class="glass-card max-w-lg w-full h-full max-h-[90vh] overflow-y-auto rounded-3xl border border-purple-500/40 p-6 relative space-y-6 text-left">
                <button 
                  onClick={() => setShowSettingsDrawer(false)}
                  class="absolute top-4 right-4 w-8 h-8 rounded-full bg-white/10 text-white font-bold flex items-center justify-center hover:bg-white/20 transition-colors"
                >
                  ✕
                </button>

                <div>
                  <h3 class="text-2xl font-black text-white flex items-center gap-2">
                    ⚙️ FUWEB Creator Hub Settings
                  </h3>
                  <p class="text-xs text-gray-400 mt-1">Customize creator branding, avatar, tagline, and follower statistics live.</p>
                </div>

                <form onSubmit={handleSaveCreatorConfig} class="space-y-4 text-xs font-bold text-gray-300">
                  <div>
                    <label class="block uppercase mb-1">Creator Name</label>
                    <input 
                      type="text" 
                      value={creatorConfig.name}
                      onChange={(e) => setCreatorConfig({ ...creatorConfig, name: e.target.value })}
                      class="w-full px-3 py-2 rounded-xl bg-white/5 border border-white/10 text-white focus:outline-none focus:border-purple-500"
                    />
                  </div>

                  <div>
                    <label class="block uppercase mb-1">Creator Handle</label>
                    <input 
                      type="text" 
                      value={creatorConfig.handle}
                      onChange={(e) => setCreatorConfig({ ...creatorConfig, handle: e.target.value })}
                      class="w-full px-3 py-2 rounded-xl bg-white/5 border border-white/10 text-white focus:outline-none focus:border-purple-500"
                    />
                  </div>

                  <div>
                    <label class="block uppercase mb-1">Bio Tagline</label>
                    <textarea 
                      rows="2"
                      value={creatorConfig.tagline}
                      onChange={(e) => setCreatorConfig({ ...creatorConfig, tagline: e.target.value })}
                      class="w-full px-3 py-2 rounded-xl bg-white/5 border border-white/10 text-white focus:outline-none focus:border-purple-500"
                    ></textarea>
                  </div>

                  <div>
                    <label class="block uppercase mb-1">Avatar Image URL</label>
                    <input 
                      type="text" 
                      value={creatorConfig.avatarUrl}
                      onChange={(e) => setCreatorConfig({ ...creatorConfig, avatarUrl: e.target.value })}
                      class="w-full px-3 py-2 rounded-xl bg-white/5 border border-white/10 text-white focus:outline-none focus:border-purple-500"
                    />
                  </div>

                  <div class="grid grid-cols-2 gap-3 pt-2">
                    <div>
                      <label class="block uppercase mb-1">YouTube Count</label>
                      <input 
                        type="text" 
                        value={creatorConfig.ytCount}
                        onChange={(e) => setCreatorConfig({ ...creatorConfig, ytCount: e.target.value })}
                        class="w-full px-3 py-2 rounded-xl bg-white/5 border border-white/10 text-white"
                      />
                    </div>
                    <div>
                      <label class="block uppercase mb-1">Instagram Count</label>
                      <input 
                        type="text" 
                        value={creatorConfig.instaCount}
                        onChange={(e) => setCreatorConfig({ ...creatorConfig, instaCount: e.target.value })}
                        class="w-full px-3 py-2 rounded-xl bg-white/5 border border-white/10 text-white"
                      />
                    </div>
                  </div>

                  <button 
                    type="submit" 
                    class="w-full py-3 rounded-xl bg-gradient-to-r from-electricPurple to-pink-500 text-white font-extrabold uppercase text-xs shadow-lg shadow-purple-500/30 hover:scale-105 transition-transform"
                  >
                    Save & Update FUWEB Hub Live
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer class="mt-auto border-t border-white/10 py-10 px-4 md:px-8 bg-brandDark/90">
            <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-6">
              
              <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-electricPurple to-cyanGlow p-0.5">
                  <div class="w-full h-full bg-brandDark rounded-[6px] flex items-center justify-center font-black text-sm text-cyan-400">
                    FU
                  </div>
                </div>
                <span class="font-extrabold text-sm text-gray-300">© 2026 {creatorConfig.name} Media Group. All rights reserved.</span>
              </div>

              <div class="flex items-center gap-6 text-xs font-semibold text-gray-400">
                <button onClick={() => setPrivacyModal(true)} class="hover:text-white transition-colors">Privacy Policy</button>
                <button onClick={() => setPrivacyModal(true)} class="hover:text-white transition-colors">Terms of Service</button>
                <a href="#hub" class="hover:text-white transition-colors">Social Bridges</a>
                <button onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })} class="text-purple-400 hover:text-purple-300 font-bold">Back to Top ↑</button>
              </div>

            </div>
          </footer>

          {/* PRIVACY MODAL */}
          {privacyModal && (
            <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-xl flex items-center justify-center p-4">
              <div class="glass-card max-w-lg w-full rounded-3xl border border-white/10 p-6 relative space-y-4 text-left">
                <button 
                  onClick={() => setPrivacyModal(false)}
                  class="absolute top-4 right-4 w-8 h-8 rounded-full bg-white/10 text-white font-bold flex items-center justify-center hover:bg-white/20 transition-colors"
                >
                  ✕
                </button>
                <h3 class="text-xl font-black text-white">Privacy Terms & Member Guidelines</h3>
                <p class="text-xs text-gray-300 leading-relaxed">
                  {creatorConfig.name} Media respects user privacy. The FUWEB VIP Circle utilizes simulated Google Auth for demonstrative member perks. No private user data is shared with third parties.
                </p>
                <button 
                  onClick={() => setPrivacyModal(false)}
                  class="w-full py-2.5 rounded-xl bg-white/10 text-white font-bold text-xs hover:bg-white/20 transition-colors"
                >
                  Close Terms
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script> 
</body>
</html>
